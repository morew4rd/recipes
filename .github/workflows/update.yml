name: Update recipes

# Re-scrapes the profile for new recipes, rebuilds the static site,
# and publishes it to the gh-pages branch.

on:
  workflow_dispatch:       # manual "Run workflow" button only

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape new recipes (incremental, polite)
        run: python3 scrape.py

      - name: Build static site
        run: python3 build_site.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no new recipes"
          else
            git commit -m "Update recipes ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Deploy site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
